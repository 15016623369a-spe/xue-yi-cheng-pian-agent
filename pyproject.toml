[project]
name = "learning-video-agent"
version = "0.2.0"
description = "Local MD-to-storyboard workbench and resumable educational video production"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
learning-video = "video_agent.cli:main"

[tool.setuptools.packages.find]
include = ["video_agent*"]
